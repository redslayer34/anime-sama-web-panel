# Blueprint Render : https://render.com/docs/blueprint-spec
# Déploiement : Render → New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: anime-sama-panel
    runtime: docker          # comptes plus anciens : remplacer par « env: docker »
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Demandé au déploiement et jamais stocké dans le dépôt.
      # Identifiant par défaut : « panel ».
      - key: PANEL_PASSWORD
        sync: false
      # Réindexe le catalogue au démarrage s'il est vide (disque effacé à
      # chaque redémarrage sur l'offre gratuite).
      - key: PANEL_AUTO_INDEX
        value: "1"
      # Résolutions d'épisodes simultanées. Au-delà d'une douzaine, les
      # hébergeurs vidéo limitent les requêtes venant d'une même adresse.
      # Doit rester égal à WORKERS_DEFAULT (docker/speedup_patch.py) :
      # tests/unit/test_config_consistency.py le vérifie.
      - key: PANEL_RESOLVER_WORKERS
        value: "8"
